{% extends "base.html" %}
{% block titulo %}{{ titulo_pagina }} — FluxoPag{% endblock %}

{% block conteudo %}
<div class="cabecalho-pagina">
    <div>
        <a class="ligacao-voltar" href="{{ url_for('produtos') }}">← Voltar para produtos</a>
        <h1>{{ titulo_pagina }}</h1>
        <p>Preencha os dados que serão utilizados nas comandas.</p>
    </div>
</div>

<section class="painel painel-formulario">
    <form method="post" class="grade-formulario">
        <label class="campo-inteiro">
            <span>Nome do produto</span>
            <input type="text" name="nome" required minlength="2" maxlength="100"
                   value="{{ request.form.get('nome', produto.nome if produto else '') }}">
        </label>
        <label>
            <span>Preço</span>
            <input type="text" name="preco" inputmode="decimal" required placeholder="R$ 0,00"
                   value="{{ request.form.get('preco', ('%.2f'|format(produto.preco)|replace('.', ',')) if produto else '') }}">
        </label>
        <label>
            <span>Categoria</span>
            {% set current_category = request.form.get('id_categoria', produto.id_categoria if produto else '')|string %}
            <select name="id_categoria" required>
                <option value="">Selecione</option>
                {% for categoria in categorias if categoria.ativo %}
                    <option value="{{ categoria.id_categoria }}" {{ 'selected' if current_category == categoria.id_categoria|string else '' }}>
                        {{ categoria.nome }}
                    </option>
                {% endfor %}
            </select>
        </label>
        <div class="acoes-formulario campo-inteiro">
            <a class="botao secundario" href="{{ url_for('produtos') }}">Cancelar</a>
            <button class="botao primario" type="submit">Salvar produto</button>
        </div>
    </form>
</section>
{% endblock %}
